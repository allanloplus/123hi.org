<!-- 首頁轉向頁（Google Sites「整頁嵌入」用的網址）。本身沒有內容：
     依星期幾轉到當天的版本（星期一到星期日＝versions.js 清單由左到右的前七個，經典版不納入）。
     ?style=<id> 轉到指定版本（例如 ?style=sticker，相容舊連結）；?day=1～7 可測試星期幾。其他參數與 #分頁 一併帶過去。 -->
<script src="versions.js"></script>
<script>
(function () {
  var m = location.search.match(/[?&]style=([a-z]+)/), V = window.HOME_VERSIONS || [], v = null;
  if (m) for (var i = 0; i < V.length; i++) if (V[i].id === m[1]) v = V[i];
  v = v || (window.HOME_TODAY && window.HOME_TODAY());
  if (v) location.replace(v.file + location.search + location.hash);
})();
</script>
