<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allan's 資安島｜ISMS·普拉斯</title>
<meta name="description" content="10 座六角島拼成一面資安盾牌：資安情資、課程動畫、ISMS 流程、個案研究、課後測驗與 AI 遊樂場，Allan 與阿拉蕾帶你逛。">
<meta name="theme-color" content="#14213d">
<meta property="og:title" content="Allan's 資安島｜ISMS·普拉斯">
<meta property="og:description" content="一座島，一類資源，拼成一面資安盾牌。從一個資源開始，看見知識之間的關係。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="island.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/"}}</script>
<script type="module" src="app.js"></script>
</head>
<body>
<main id="app">
  <div id="stage" class="stage" role="img" aria-label="10 座六角島組成盾牌形的互動資源地圖；完整文字操作請用資源清單"></div>
  <div id="labels" class="labels"></div>

  <header class="brand">
    <a class="logo" href="../" target="_blank" rel="noopener" title="回 ISMS·普拉斯 首頁">ISMS<span>PLUS<i>.</i></span></a>
    <div class="brand-r"><h1>Allan's 資安島</h1><p><em>ISMS·普拉斯</em> 資源地圖</p></div>
  </header>

  <div class="hero-note" id="heroNote">
    <div class="number">10</div>
    <h2>一座島，一類資源<br>拼成一面資安盾牌</h2>
    <p>從一個資源開始，<br>看見知識之間的關係。</p>
  </div>

  <nav class="toolbar" aria-label="地圖操作">
    <button id="homeBtn" title="回到全景"><svg class="tb-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg><span>全景</span></button>
    <button id="tourBtn" title="自動導覽"><svg class="tb-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z"/></svg><span>導覽</span></button>
    <button id="ctrlBtn" class="mob-only" aria-pressed="false" title="ISMS 的一年・學習路線"><svg class="tb-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/></svg><span>路線</span></button>
    <button id="sideBtn" aria-pressed="false" title="資源清單"><svg class="tb-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg><span>清單</span></button>
    <button id="helpBtn" class="sq" aria-label="操作說明">?</button>
  </nav>

  <div class="hud" id="hud" aria-label="顯示選項">
    <div class="seg seg-time" role="group" aria-label="時段">
      <button data-time="dawn" title="清晨" aria-label="清晨" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 17h16M7 17a5 5 0 0110 0M12 6v3M5.5 9.5l2 2M18.5 9.5l-2 2"/></svg></button>
      <button data-time="day" title="白天" aria-label="白天" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
      <button data-time="dusk" title="黃昏" aria-label="黃昏" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 18h18M6 18a6 6 0 0112 0M4 14h2M18 14h2M12 7v2M9 21h6"/></svg></button>
      <button data-time="night" title="夜晚" aria-label="夜晚" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M19 15A8 8 0 019 5a7 7 0 1010 10z"/></svg></button>
    </div>
    <div class="seg seg-tg" role="group" aria-label="顯示圖層">
      <button data-toggle="names" aria-pressed="true" title="島名"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/></svg><span>島名</span></button>
      <button data-toggle="carry" aria-pressed="true" title="搬運圖示"><svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="6"/><path d="M9 20l3-3 3 3"/></svg><span>搬運</span></button>
      <button data-toggle="flows" aria-pressed="false" title="知識流"><svg viewBox="0 0 24 24"><path d="M4 17c4-8 12-2 16-10"/><circle cx="4" cy="17" r="2"/><circle cx="20" cy="7" r="2"/></svg><span>知識流</span></button>
      <button data-toggle="freeze" aria-pressed="false" title="暫停動畫"><svg viewBox="0 0 24 24"><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></svg><span>暫停</span></button>
      <button data-toggle="bird" aria-pressed="false" title="鳥瞰"><svg viewBox="0 0 24 24"><path d="M3 12l9-7 9 7-9 7z"/><path d="M3 12v3l9 7 9-7v-3"/></svg><span>鳥瞰</span></button>
      <button data-toggle="log" aria-pressed="false" title="島嶼日誌"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg><span>日誌</span></button>
    </div>
  </div>

  <aside id="sidebar" class="sidebar" aria-label="完整資源與知識流清單">
    <button id="sideHandle" class="sheet-handle mob-only" aria-label="收合清單"><i></i></button>
    <div class="side-head">
      <div class="eyebrow">THE ISMS INDEX</div>
      <h2>把資源，連成一座島。</h2>
      <button id="sideClose" class="x mob-only" aria-label="關閉清單">✕</button>
      <p id="sideSum"></p>
      <input id="search" class="search" type="search" aria-label="搜尋資源" placeholder="搜尋資源、條文、關鍵字…">
      <div class="side-tabs" role="tablist">
        <button id="tabIslands" class="active" role="tab" aria-selected="true">主題島</button>
        <button id="tabFlows" role="tab" aria-selected="false">知識流</button>
      </div>
    </div>
    <div id="tree" class="tree"></div>
  </aside>

  <article id="card" class="card" hidden aria-label="選取項目詳細資料" aria-live="polite">
    <button id="cardHandle" class="sheet-handle mob-only" aria-label="展開或收合"><i></i></button>
    <button class="x" id="cardClose" aria-label="關閉詳細資料">×</button>
    <div id="cardBody"></div>
  </article>

  <section class="controls" id="controls" aria-label="ISMS 的一年、學習路線與標準篩選">
    <div id="hudSlot" class="hud-slot mob-only"></div>
    <div class="ctrl-tabs" role="tablist">
      <button role="tab" data-tab="year" class="active" aria-selected="true">01 ISMS 的一年</button>
      <button role="tab" data-tab="path" aria-selected="false">02 學習路線</button>
      <button role="tab" data-tab="std" aria-selected="false">03 標準篩選</button>
      <div class="status" id="status"></div>
    </div>
    <div class="panel active" id="panel-year" role="tabpanel">
      <div class="year-row">
        <button id="yearPlay" class="play" aria-label="播放一年">▶</button>
        <output id="monthOut">10 月</output>
        <input id="month" type="range" min="1" max="12" step="1" value="10" aria-label="ISMS 的一年，月份">
      </div>
      <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span></div>
      <p class="control-note" id="yearNote"></p>
    </div>
    <div class="panel" id="panel-path" role="tabpanel">
      <div class="chipbtns" id="pathBtns"></div>
      <p class="control-note" id="pathNote">選一個身分，看推薦的走訪順序。</p>
    </div>
    <div class="panel" id="panel-std" role="tabpanel">
      <div class="chipbtns" id="stdBtns"></div>
      <p class="control-note" id="stdNote">可複選。高亮有相關資源的島，卡片裡的對應資源也會標出來。</p>
    </div>
  </section>

  <aside class="log" id="log" hidden aria-label="島嶼日誌">
    <div class="log-head">
      <div><div class="eyebrow">ISLAND LOG</div><h3>島嶼日誌</h3></div>
      <button class="x" id="logClose" aria-label="關閉島嶼日誌">×</button>
    </div>
    <div class="log-tabs" role="tablist">
      <button role="tab" data-logtab="overview" aria-selected="false">島嶼概況</button>
      <button role="tab" data-logtab="log" aria-selected="true">日誌</button>
    </div>
    <div id="overviewPanel" class="overview-panel" hidden></div>
    <div id="logBody" class="log-body">
      <div class="log-filters"><span class="live"><i></i>LIVE</span><select id="logFlow" aria-label="篩選知識流"></select></div>
      <ol id="logList" tabindex="0" aria-label="事件列表"></ol>
    </div>
  </aside>

  <div class="mascot" id="mascot"><img src="../assets/img/arale-wave.webp" alt=""><span id="mascotText"><b>阿拉蕾</b> · 點一座島，開始探索</span></div>

  <div class="tour" id="tour" hidden aria-live="polite">
    <img id="tourImg" src="../assets/img/allan-smile.webp" alt="">
    <p id="tourText"></p>
    <div class="tour-ctrl"><span id="tourCount">01 / 12</span><button id="tourPause">暫停</button><button id="tourReplay">重播</button><button id="tourExit">離開</button></div>
  </div>

  <div class="intro" id="intro" hidden>
    <div class="intro-box" role="dialog" aria-modal="true" aria-labelledby="introTitle">
      <img class="intro-pic" src="../assets/img/arale-wave.webp" alt="">
      <div class="eyebrow" id="introCount">HELLO, ISMS / 01</div>
      <h2 id="introTitle"></h2>
      <p id="introBody"></p>
      <div class="intro-dots" id="introDots"></div>
      <div class="intro-actions"><button id="introSkip">略過</button><button id="introNext" class="next">下一步 →</button></div>
    </div>
  </div>

  <div id="loading" class="loading" role="status">
    <div class="hexes" aria-hidden="true"><i></i><i></i><i></i></div>
    <h2>Allan's 資安島</h2>
    <p>正在組裝資安島…</p>
  </div>
  <noscript><p class="noscript">此頁需要 JavaScript。也可以直接回 <a href="../">ISMS·普拉斯 首頁</a>。</p></noscript>
</main>
</body>
</html>
